# Configuration of Academic
# Documentation: https://sourcethemes.com/academic/

# The URL of your site.
# End your URL with a `/` trailing slash
baseurl = "https://Lebeduh21.github.io/"

# Title of your site
title = "Мой сайт"

# Enter a copyright notice to display in the site footer.
copyright = ""

# Enable analytics by entering your Google Analytics tracking ID
googleAnalytics = ""

# Enable comments by entering your Disqus shortname
disqusShortname = ""

# Name of Academic theme folder in `themes/`.
theme = "academic"

# Enable Emoji emoticons
enableEmoji = true

# Get last modified date for content from Git?
enableGitInfo = false

# Default language to use
defaultContentLanguage = "ru"
hasCJKLanguage = false
defaultContentLanguageInSubdir = false
removePathAccents = true

# Number of items per page in paginated lists
paginate = 10

# Ignore files
ignoreFiles = ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[blackfriday]
  hrefTargetBlank = true
  angledQuotes = false
  latexDashes = true

[taxonomies]
  tag = "tags"
  category = "categories"
  publication_type = "publication_types"
  author = "authors"
